# ~/.config/alacritty/alacritty.toml 에 병합
# Argonaut Readable — terminals/windows-terminal.json 에서 생성. 값을 고칠 땐 그 파일을 고치고 다시 생성한다.
[colors.primary]
background = "#0e1019"
foreground = "#fffaf4"

[colors.normal]
black   = "#232323"
red     = "#ff000f"
green   = "#8ce10b"
yellow  = "#ffb900"
blue    = "#008df8"
magenta = "#6d43a6"
cyan    = "#00d8eb"
white   = "#ffffff"

[colors.bright]
black   = "#828282"
red     = "#ff2740"
green   = "#abe15b"
yellow  = "#ffd242"
blue    = "#0092ff"
magenta = "#9a5feb"
cyan    = "#67fff0"
white   = "#ffffff"
